name = "aestra-license-signing"
main = "src/index.ts"
compatibility_date = "2026-05-06"

[vars]
AESTRA_STORAGE_MODE = "d1"

# Secrets (set via wrangler secret put — never commit values here):
#   AESTRA_LICENSE_SIGNING_PRIVATE_KEY   base64 raw 64-byte Ed25519 secret key (tweetnacl format)
#   AESTRA_ADMIN_API_KEY                 hex random 32-byte admin bearer token
#   AESTRA_SIGNING_KEY_ID                string key identifier e.g. prod-2026-05
#   AESTRA_RESEND_API_KEY                Resend API key (re_...) for email delivery
#   AESTRA_LOGIN_MAILER_MODE             fixture | smtp (production requires smtp)

[[d1_databases]]
binding = "AESTRA_LICENSE_DB"
database_name = "aestra-license"
database_id = "4c09044c-95fc-4896-87ac-51cac5b99b91"
migrations_dir = "migrations"

# Bind the account API to the production host so the DAW client (which defaults to
# https://www.aestra.studio) reaches the worker instead of the static site. Scoped
# to /v1/account/* — all other paths still serve the website.
[[routes]]
pattern = "www.aestra.studio/v1/account/*"
zone_name = "aestra.studio"
