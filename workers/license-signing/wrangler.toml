name = "aestra-license-signing"
main = "src/index.ts"
compatibility_date = "2026-05-06"

# Secrets are intentionally not stored here.
# Configure production values with:
#   wrangler secret put AESTRA_LICENSE_SIGNING_PRIVATE_KEY
#   wrangler secret put AESTRA_ADMIN_API_KEY
#   wrangler secret put AESTRA_SIGNING_KEY_ID
#
# AESTRA_LICENSE_SIGNING_PRIVATE_KEY must be base64 raw 64-byte Ed25519
# secret key material compatible with tweetnacl.sign.detached().
