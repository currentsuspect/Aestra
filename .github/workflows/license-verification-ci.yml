name: License Verification CI

on:
  push:
    branches:
      - codex/windows-license-verification-parity
  workflow_dispatch:

jobs:
  windows-license-verification:
    name: Windows headless license verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.28"

      - name: Setup vcpkg and libsodium
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install libsodium:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-win `
            -DAestra_CORE_MODE=ON `
            -DAESTRA_HEADLESS_ONLY=ON `
            -DAESTRA_ENABLE_TESTS=ON `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: pwsh
        run: cmake --build build-win --config Release --parallel 2

      - name: Test
        shell: pwsh
        run: ctest --test-dir build-win -C Release -R "SecLicenseGateSignature|SecLicenseProfileHardening|SecJsonParserHardening" --output-on-failure

  linux-license-verification:
    name: Linux headless license verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.28"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsodium-dev libsecret-1-dev libasound2-dev

      - name: Configure
        run: |
          cmake -S . -B build-headless \
            -DAestra_CORE_MODE=ON \
            -DAESTRA_HEADLESS_ONLY=ON \
            -DAESTRA_ENABLE_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-headless --parallel 2

      - name: Test
        run: ctest --test-dir build-headless -R "SecLicenseGateSignature|SecLicenseProfileHardening|SecJsonParserHardening" --output-on-failure
