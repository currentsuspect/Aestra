name: PR 740 one-shot self-transition fix

on:
  push:
    branches:
      - fix/piano-roll-contextual-editor

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/piano-roll-contextual-editor
          fetch-depth: 0

      - name: Apply verified AestraContent fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("Source/Core/AestraContent.cpp")
          text = path.read_text()
          marker = "void AestraContent::setViewFocus(ViewFocus focus) {"
          before, body = text.split(marker, 1)

          old = """    bool wasPlaying = (m_transportBar && m_transportBar->getState() == TransportState::Playing);\n    ViewFocus previousFocus = m_viewFocus;\n\n    m_viewFocus = focus;\n"""
          new = """    bool wasPlaying = (m_transportBar && m_transportBar->getState() == TransportState::Playing);\n    ViewFocus previousFocus = m_viewFocus;\n    const bool focusChanged = (focus != previousFocus);\n\n    m_viewFocus = focus;\n"""
          if body.count(old) != 1:
              raise SystemExit(f"focus prelude count={body.count(old)}")
          body = body.replace(old, new, 1)

          old = "        if (focus == ViewFocus::Arsenal) {"
          if body.count(old) < 1:
              raise SystemExit("Arsenal branch not found")
          body = body.replace(old, "        if (focusChanged && focus == ViewFocus::Arsenal) {", 1)

          old = "        else if (focus == ViewFocus::Timeline) {"
          if body.count(old) < 1:
              raise SystemExit("Timeline branch not found")
          body = body.replace(old, "        else if (focusChanged && focus == ViewFocus::Timeline) {", 1)

          audition = """        // === ENTERING AUDITION ===\n        else if (focus == ViewFocus::Audition) {\n"""
          self_refresh = """        // Self-transitions refresh UI only. Engine, transport, preview,\n        // scheduler, and position state must remain untouched.\n        else if (!focusChanged && focus == ViewFocus::Arsenal) {\n            if (m_trackManagerUI) {\n                m_trackManagerUI->setPatternMode(true);\n                m_trackManagerUI->setFollowPlayhead(false);\n            }\n            if (m_auditionPanel)\n                m_auditionPanel->setVisible(false);\n            if (m_trackManagerUI)\n                m_trackManagerUI->setVisible(true);\n        }\n        else if (!focusChanged && focus == ViewFocus::Timeline) {\n            if (m_trackManagerUI) {\n                m_trackManagerUI->setPatternMode(false);\n                m_trackManagerUI->setFollowPlayhead(true);\n            }\n            if (m_auditionPanel)\n                m_auditionPanel->setVisible(false);\n            if (m_trackManagerUI)\n                m_trackManagerUI->setVisible(true);\n        }\n        // === ENTERING AUDITION ===\n        else if (focus == ViewFocus::Audition) {\n"""
          if body.count(audition) != 1:
              raise SystemExit(f"Audition marker count={body.count(audition)}")
          body = body.replace(audition, self_refresh, 1)

          text = before + marker + body
          old = """    AESTRA_LOG_DEBUG(\"AestraContent::setAudioEngine called - Initializing View State\");\n    // Ensure correct initial state now that engine is valid\n    setViewFocus(ViewFocus::Timeline);\n"""
          new = """    AESTRA_LOG_DEBUG(\"AestraContent::setAudioEngine called - Initializing View State\");\n    // Timeline is already the default focus on first engine attachment. Since a\n    // focus self-transition is engine-idempotent, initialize that engine state\n    // explicitly before using setViewFocus() for the UI refresh.\n    if (m_audioEngine && m_viewFocus == ViewFocus::Timeline) {\n        m_audioEngine->setPatternPlaybackMode(false, 4.0);\n        m_audioEngine->setAuditionModeEnabled(false);\n        if (m_trackManager) {\n            m_trackManager->setStopPreviewCallback([this]() { stopSoundPreview(); });\n            m_trackManager->setPosition(m_savedTimelinePosition);\n            m_trackManager->setPlayStartPosition(m_savedTimelinePosition);\n        }\n    }\n    setViewFocus(ViewFocus::Timeline);\n"""
          if text.count(old) != 1:
              raise SystemExit(f"setAudioEngine tail count={text.count(old)}")
          text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Verify and commit patch
        run: |
          git diff --check
          git diff -- Source/Core/AestraContent.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr740-self-transition-fix.yml
          git add Source/Core/AestraContent.cpp
          git commit -m "fix(ui): make DAW focus self-transitions engine-idempotent"
          git push origin HEAD:fix/piano-roll-contextual-editor
