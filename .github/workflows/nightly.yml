name: Nightly Build

on:
  schedule:
    - cron: '0 23 * * *' # 2:00 AM EAT (UTC+3)
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly-headless:
    name: Nightly Headless Build & Test (ASan+UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false
          ref: develop
          persist-credentials: false

      - name: Capture develop SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libasound2-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libsodium-dev \
            libsecret-1-dev libgtest-dev

      - name: Configure (headless, ASan+UBSan)
        run: |
          cmake -S . -B build-nightly \
            -G Ninja \
            -DAestra_CORE_MODE=ON \
            -DAESTRA_HEADLESS_ONLY=ON \
            -DAESTRA_ENABLE_TESTS=ON \
            -DAESTRA_CI=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-nightly --parallel

      - name: Test
        run: ctest --test-dir build-nightly --output-on-failure

      # Triage material only, and only when there is something to triage.
      #
      # This used to be `path: build-nightly/` with `if: always()`, which uploaded
      # the ENTIRE build tree — object files, static libraries, CMake cache — on
      # every run including successful ones. At ~3.6 GB per nightly against a 7-day
      # retention that is a standing ~25 GB, and it was 77% of the repository's
      # total Actions artifact storage when it was found (2026-09-12: 32.95 GB live,
      # of which 25.4 GB was seven nightly uploads).
      #
      # Nothing consumed those object files. What a failing nightly actually needs
      # is the ctest output, which is what `Testing/` holds — kilobytes, not
      # gigabytes. A successful nightly needs nothing at all: the run log already
      # records that it passed.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-linux-${{ github.run_id }}
          path: |
            build-nightly/Testing/
            build-nightly/**/*.log
          if-no-files-found: warn
          retention-days: 7

  # Moved from ci.yml on 2026-11-14 (owner: "macOS to nightly"). macOS is deferred to 2027 (FD-10), so it
  # no longer holds pull requests for 28-33 minutes; it still builds and tests develop every night, and a
  # failure opens the nightly issue like the headless job.
  build-macos:
    name: macOS (Clang)
    permissions:
      contents: read
    env:
      BUILD_TYPE: Release
    timeout-minutes: 75
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false
          ref: develop
          persist-credentials: false

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache
      - name: Install Dependencies
        run: |
          brew update
          brew install cmake pkg-config libsodium googletest

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DAestra_CORE_MODE=ON -DAESTRA_CI=ON -DCMAKE_PREFIX_PATH="/opt/homebrew;/usr/local" -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: build
        run: ctest --test-dir . --output-on-failure --output-junit ctest-results-macos.xml

      - name: Security contract tests
        # Was a hand-written list of three names, repeated identically in the
        # Linux, Windows and macOS lanes. Three copies of a literal drift
        # independently, and the list could only ever name what someone
        # remembered to add — it had not grown since it was written, while the
        # security suite reached 29 cases.
        #
        # --no-tests=error is load-bearing: without it, a typo in the label or a
        # renamed contract selects nothing and ctest exits 0. A security step
        # that silently runs zero tests is worse than no step, because it
        # reports success.
        run: ctest --test-dir build -L '^contract:security$' --no-tests=error --output-on-failure

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ctest-results-macos
          path: build/ctest-results-macos.xml
          if-no-files-found: ignore

      - name: Discord Notification
        if: always() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          STATUS="${{ job.status }}"
          COLOR=3066993; [ "$STATUS" != "success" ] && COLOR=15158332
          cat > discord_payload.json <<EOF
          {
            "username": "Aestra CI",
            "embeds": [{
              "title": "CI — macOS: $STATUS",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "color": $COLOR,
              "footer": {"text": "sha ${{ github.sha }}"}
            }]
          }
          EOF
          curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" --data @discord_payload.json "$DISCORD_WEBHOOK"

  open-issue-on-failure:
    name: Open Nightly Failure Issue
    runs-on: ubuntu-latest
    needs: [nightly-headless, build-macos]
    if: ${{ always() && (needs.nightly-headless.result == 'failure' || needs.build-macos.result == 'failure') }}
    permissions:
      issues: write

    steps:
      - name: Open issue on failure
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const sha = '${{ needs.nightly-headless.outputs.sha || 'develop checkout unavailable' }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Nightly] Build or test failure — ${date}`,
              labels: ['nightly-failure', 'ci'],
              body: [
                `Nightly build failed on \`develop\` (headless: ${{ needs.nightly-headless.result }}, macOS: ${{ needs.build-macos.result }}).\n`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Commit:** ${sha}`,
                `**Date:** ${date}`,
                ``,
                `Investigate the failing run and resolve before closing this issue.`
              ].join('\n')
            });
