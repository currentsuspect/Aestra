name: DSP Benchmark

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of benchmark iterations'
        required: false
        default: '10'
        type: number
  push:
    branches: [ develop ]
    paths:
      - 'AestraAudio/include/DSP/Interpolators.h'
      - 'AestraAudio/include/DSP/Sinc*.h'
      - 'AestraAudio/src/DSP/*.cpp'
      - 'Tests/AestraAudio/SincBenchmark.cpp'
      - 'Tests/AestraAudio/AestraStressTest.cpp'
      - 'Tests/Integration/AestraStressTest.cpp'
      - 'Tests/CMakeLists.txt'
      - '.github/workflows/dsp-benchmark.yml'

jobs:
  benchmark:
    name: Sinc Interpolator Benchmark
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 libasound2-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libsodium-dev

      - name: Configure build
        run: |
          cmake -S . -B build-bench \
            -DAestra_CORE_MODE=ON \
            -DAESTRA_HEADLESS_ONLY=ON \
            -DAESTRA_ENABLE_UI=OFF \
            -DAESTRA_ENABLE_TESTS=ON \
            -DAESTRA_ENABLE_EXPERIMENTAL_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build benchmarks
        run: |
          cmake --build build-bench --target AestraSincBenchmark --target AestraStressTest --parallel

      - name: CPU info
        run: |
          echo "## CPU Information" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          lscpu | grep -E 'Model name|Architecture|CPU\(s\)|Thread|Core|MHz' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## CPU Features" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -oP ' \K[a-z0-9_]+' /proc/cpuinfo | sort -u | tr '\n' ' ' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run benchmark
        run: |
          ITERATIONS=${{ github.event.inputs.iterations || 10 }}
          echo "Running benchmark with $ITERATIONS iterations..."
          ./build-bench/Tests/AestraSincBenchmark --iterations "$ITERATIONS" --json 2>/dev/null > benchmark_raw.json || true

          python3 -c "
          import json
          with open('benchmark_raw.json') as f:
              data = json.load(f)
          print('## Sinc Interpolator Benchmark Results')
          print('')
          print(f\"**Iterations:** {data['iterations']}\")
          print(f\"**Runner:** GitHub Actions ubuntu-22.04\")
          print('')
          print('| Algorithm | MFrame/sec (median) | us/block (median) | CV |')
          print('|-----------|---------------------|-------------------|-----|')
          for algo in data['algorithms']:
              mfps = algo['median_mframes_per_sec']
              usb = algo['median_us_per_block']
              cv = algo['cv']
              name = algo['name']
              print(f'| {name} | {mfps:.2f} | {usb:.2f} | {cv:.1%} |')
          print('')
          algorithms = data['algorithms']
          cubic_mfps = None
          for algo in algorithms:
              if algo['algo_id'] == 'cubic_4pt':
                  cubic_mfps = algo['median_mframes_per_sec']
                  break
          if cubic_mfps:
              print('### Relative Performance')
              print('')
              print('| Algorithm | Relative to Cubic |')
              print('|-----------|-------------------|')
              for algo in algorithms:
                  rel = algo['median_mframes_per_sec'] / cubic_mfps
                  print(f'| {algo[\"name\"]} | {rel:.2f}x |')
          print('')
          " >> $GITHUB_STEP_SUMMARY || true

      - name: Run stress test
        run: |
          python3 -c "
          import subprocess, json, sys

          results = []
          for clips in [16, 32, 64, 128]:
              result = subprocess.run([
                  './build-bench/Tests/AestraStressTest',
                  '--clips', str(clips),
                  '--quality', 'sinc8_turbo',
                  '--buffer-size', '256',
                  '--sample-rate', '48000',
                  '--iterations', '10',
                  '--json'
              ], capture_output=True, text=True)

              text = result.stdout + result.stderr
              start = text.find('{')
              end = text.rfind('}') + 1
              if start >= 0 and end > start:
                  data = json.loads(text[start:end])
                  r = data['results']
                  results.append({
                      'clips': clips,
                      'median_ms': r['median_ms'],
                      'p99_ms': r['p99_ms'],
                      'cv': r['cv'],
                      'budget_usage_pct': r['budget_usage_pct'],
                      'passed': r['passed']
                  })

          with open('stress_test_results.json', 'w') as f:
              json.dump({'results': results}, f, indent=2)

          print('## Stress Test Results')
          print('')
          print('| Clips | Median | P99 | Budget Usage | Status |')
          print('|-------|--------|-----|-------------|--------|')
          for r in results:
              icon = '✅' if r['passed'] else '❌'
              print(f'| {r[\"clips\"]} | {r[\"median_ms\"]:.2f}ms | {r[\"p99_ms\"]:.2f}ms | {r[\"budget_usage_pct\"]:.1f}% | {icon} |')
          print('')
          print('**Budget:** 5.33ms per callback (256 samples @ 48kHz)')
          print('**Target:** <70% budget (3.73ms)')
          print('**Quality:** Sinc8 TURBO (~100dB SNR)')
          print('')
          print('Note: Real-world capacity will be lower due to plugin processing,')
          print('mixing, disk I/O, and UI overhead.')
          " >> $GITHUB_STEP_SUMMARY

      - name: Check variance
        run: |
          python3 -c "
          import json
          with open('benchmark_raw.json') as f:
              data = json.load(f)
          print('## Variance Analysis')
          print('')
          high_cv = False
          for algo in data['algorithms']:
              cv = algo['cv']
              name = algo['name']
              status = '⚠️ HIGH VARIANCE' if cv > 0.05 else '✅ Stable'
              if cv > 0.05:
                  high_cv = True
              print(f'- {name}: CV = {cv:.1%} — {status}')
          print('')
          if high_cv:
              print('⚠️ Some benchmarks exceeded 5% CV. Results may be unreliable.')
          else:
              print('✅ All benchmarks within acceptable variance (< 5% CV).')
          " >> $GITHUB_STEP_SUMMARY || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark_raw.json
            stress_test_results.json
