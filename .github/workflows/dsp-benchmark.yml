name: DSP Benchmark

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of benchmark iterations'
        required: false
        default: '10'
        type: number
  push:
    branches: [ develop ]
    paths:
      - 'AestraAudio/include/DSP/Interpolators.h'
      - 'AestraAudio/include/DSP/Sinc*.h'
      - 'AestraAudio/src/DSP/*.cpp'
      - 'Tests/AestraAudio/SincBenchmark.cpp'
      - '.github/workflows/dsp-benchmark.yml'

jobs:
  benchmark:
    name: Sinc Interpolator Benchmark
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 libasound2-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Configure build
        run: |
          cmake -S . -B build-bench \
            -DAestra_CORE_MODE=ON \
            -DAESTRA_HEADLESS_ONLY=ON \
            -DAESTRA_ENABLE_UI=OFF \
            -DAESTRA_ENABLE_TESTS=ON \
            -DAESTRA_ENABLE_EXPERIMENTAL_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build benchmark
        run: cmake --build build-bench --target AestraSincBenchmark --parallel

      - name: CPU info
        run: |
          echo "## CPU Information" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          lscpu | grep -E 'Model name|Architecture|CPU\(s\)|Thread|Core|MHz' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## CPU Features" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -oP ' \K[a-z0-9_]+' /proc/cpuinfo | sort -u | tr '\n' ' ' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run benchmark
        id: benchmark
        run: |
          ITERATIONS=${{ github.event.inputs.iterations || 10 }}
          echo "Running benchmark with $ITERATIONS iterations..."
          OUTPUT=$(./build-bench/Tests/AestraSincBenchmark --iterations "$ITERATIONS" --json 2>/dev/null)
          echo "$OUTPUT" > benchmark_raw.json

          # Parse results
          python3 << 'PYEOF'
          import json
          import sys

          with open('benchmark_raw.json') as f:
              data = json.load(f)

          print("## Sinc Interpolator Benchmark Results")
          print("")
          print(f"**Iterations:** {data['iterations']}")
          print(f"**Runner:** GitHub Actions ubuntu-22.04")
          print("")
          print("| Algorithm | MFrame/sec (median) | us/block (median) | CV |")
          print("|-----------|---------------------|-------------------|-----|")

          for algo in data['algorithms']:
              mfps = algo['median_mframes_per_sec']
              usb = algo['median_us_per_block']
              cv = algo['cv']
              name = algo['name']
              print(f"| {name} | {mfps:.2f} | {usb:.2f} | {cv:.1%} |")

          print("")

          # Compute relative speeds
          algorithms = data['algorithms']
          cubic_mfps = None
          for algo in algorithms:
              if algo['algo_id'] == 'cubic_4pt':
                  cubic_mfps = algo['median_mframes_per_sec']
                  break

          if cubic_mfps:
              print("### Relative Performance")
              print("")
              print("| Algorithm | Relative to Cubic |")
              print("|-----------|-------------------|")
              for algo in algorithms:
                  rel = algo['median_mframes_per_sec'] / cubic_mfps
                  print(f"| {algo['name']} | {rel:.2f}x |")

          print("")
          print("<details>")
          print("<summary>Raw JSON output</summary>")
          print("")
          print('```json')
          print(json.dumps(data, indent=2))
          print('```')
          print("</details>")
          PYEOF

      - name: Check variance
        run: |
          python3 << 'PYEOF'
          import json

          with open('benchmark_raw.json') as f:
              data = json.load(f)

          print("## Variance Analysis")
          print("")

          high_cv = False
          for algo in data['algorithms']:
              cv = algo['cv']
              name = algo['name']
              status = "⚠️ HIGH VARIANCE" if cv > 0.05 else "✅ Stable"
              if cv > 0.05:
                  high_cv = True
              print(f"- {name}: CV = {cv:.1%} — {status}")

          print("")
          if high_cv:
              print("⚠️ Some benchmarks exceeded 5% CV. Results may be unreliable.")
          else:
              print("✅ All benchmarks within acceptable variance (< 5% CV).")
          PYEOF

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark_raw.json
