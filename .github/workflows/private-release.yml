name: Private Release (Aestra Plus)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true

permissions:
  contents: write

jobs:
  build-sign-package:
    runs-on: windows-2022
    environment: private-release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Ensure premium/build present
        shell: pwsh
        run: |
          $req = @('Aestra-premium','Aestra-build')
          foreach ($r in $req) { if (-not (Test-Path $r)) { Write-Error "Missing private folder: $r"; exit 1 } }
      - name: Setup CMake
        uses: lukka/get-cmake@latest
      - name: Setup vcpkg and libsodium
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install libsodium:x64-windows
      - name: Configure (full)
        shell: pwsh
        env:
          AESTRA_LICENSE_PUBLIC_KEY_HEX: ${{ secrets.AESTRA_LICENSE_PUBLIC_KEY_HEX }}
        run: |
          if ($env:AESTRA_LICENSE_PUBLIC_KEY_HEX -notmatch '^[0-9A-Fa-f]{64}$') {
            Write-Error "AESTRA_LICENSE_PUBLIC_KEY_HEX must be configured as 64 hex characters."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          cmake -S . -B build -DAestra_CORE_MODE=OFF -DAESTRA_LICENSE_ENABLE_PREMIUM_LEASES=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP\vcpkg\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Sign binaries (optional)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) {
            Write-Host "Codesign secrets not configured; skipping signing step."
            exit 0
          }
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
          $bins = Get-ChildItem build -Recurse -Include *.exe,*.dll
          foreach ($b in $bins) {
            & "C:\\Program Files (x86)\\Windows Kits\\10\\App Certification Kit\\signtool.exe" sign `
              /f $pfxPath /p $env:PFX_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $b.FullName
          }
      - name: Package artifacts
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$') {
            Write-Error "Invalid release version: $env:RELEASE_VERSION"
            exit 1
          }
          $name = "AestraStudioPlus-$env:RELEASE_VERSION.zip"
          Compress-Archive -Path build\**\*.exe,build\**\*.dll -DestinationPath $name
          echo "PACKAGE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Aestra Plus v${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: |
            ${{ env.PACKAGE_NAME }}
