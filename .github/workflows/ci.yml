name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  build-linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.28"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libgl1-mesa-dev libx11-dev libsodium-dev libsecret-1-dev

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DAestra_CORE_MODE=ON -DAESTRA_CI=ON

      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: build
        run: ctest --test-dir . --output-on-failure --output-junit ctest-results-linux.xml -E "SecOutOfProcessPluginHost|SecPluginScanIsolation"

      - name: License verification tests
        run: ctest --test-dir build -R "SecLicenseGateSignature|SecLicenseProfileHardening|SecJsonParserHardening" --output-on-failure

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-results-linux
          path: build/ctest-results-linux.xml
          if-no-files-found: ignore

      - name: Discord Notification
        if: always() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          STATUS="${{ job.status }}"
          COLOR=3066993; [ "$STATUS" != "success" ] && COLOR=15158332
          cat > discord_payload.json <<EOF
          {
            "username": "Aestra CI",
            "embeds": [{
              "title": "CI — Linux: $STATUS",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "color": $COLOR,
              "footer": {"text": "sha ${{ github.sha }}"}
            }]
          }
          EOF
          curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" --data @discord_payload.json "$DISCORD_WEBHOOK"

  build-windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.28"

      - name: Setup vcpkg and libsodium
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install libsodium:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} `
            -DAestra_CORE_MODE=ON `
            -DAESTRA_CI=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: build
        shell: bash
        run: ctest --test-dir . -C ${{env.BUILD_TYPE}} --output-on-failure --output-junit ctest-results-windows.xml -E "SecOutOfProcessPluginHost|SecPluginScanIsolation"

      - name: License verification tests
        shell: bash
        run: ctest --test-dir build -C ${{env.BUILD_TYPE}} -R "SecLicenseGateSignature|SecLicenseProfileHardening|SecJsonParserHardening" --output-on-failure

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-results-windows
          path: build/ctest-results-windows.xml
          if-no-files-found: ignore

      - name: Discord Notification
        if: always() && env.DISCORD_WEBHOOK != ''
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          STATUS="${{ job.status }}"
          COLOR=3066993; [ "$STATUS" != "success" ] && COLOR=15158332
          cat > discord_payload.json <<EOF
          {
            "username": "Aestra CI",
            "embeds": [{
              "title": "CI — Windows: $STATUS",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "color": $COLOR,
              "footer": {"text": "sha ${{ github.sha }}"}
            }]
          }
          EOF
          curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" --data @discord_payload.json "$DISCORD_WEBHOOK"

  build-macos:
    name: macOS (Clang, advisory)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.28"

      - name: Install Dependencies
        run: |
          brew update
          brew install pkg-config libsodium

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DAestra_CORE_MODE=ON -DAESTRA_CI=ON

      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: build
        run: ctest --test-dir . --output-on-failure --output-junit ctest-results-macos.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-results-macos
          path: build/ctest-results-macos.xml
          if-no-files-found: ignore

      - name: Discord Notification
        if: always() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          STATUS="${{ job.status }}"
          COLOR=3066993; [ "$STATUS" != "success" ] && COLOR=15158332
          cat > discord_payload.json <<EOF
          {
            "username": "Aestra CI",
            "embeds": [{
              "title": "CI — macOS: $STATUS",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "color": $COLOR,
              "footer": {"text": "sha ${{ github.sha }}"}
            }]
          }
          EOF
          curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" --data @discord_payload.json "$DISCORD_WEBHOOK"

  format-check:
    name: Formatting (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-14 100

      - name: Check Formatting
        run: |
          FILES=$(find AestraAudio AestraCore AestraPlat AestraUI Source Tests -name "*.cpp" -o -name "*.hpp" -o -name "*.h" | grep -v External/)
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs clang-format --dry-run --Werror 2>&1 | head -100
          fi
        continue-on-error: true

  static-analysis:
    name: Static Analysis (clang-tidy, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-14 clang-format-14 libsodium-dev libsecret-1-dev

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DAestra_CORE_MODE=ON -DAESTRA_CI=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          clang-tidy-14 --config-file=.clang-tidy \
            AestraCore/src/*.cpp \
            -- -IAestraCore/include -std=c++17 2>&1 | head -100 || true
        continue-on-error: true

  sanitizer-linux:
    name: Sanitizers (ASan/UBSan, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.28"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libgl1-mesa-dev libx11-dev libsodium-dev libsecret-1-dev

      - name: Configure
        run: >
          cmake -B build-asan -S .
          -DCMAKE_BUILD_TYPE=Debug
          -DAestra_CORE_MODE=ON
          -DAESTRA_CI=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan --config Debug

      - name: Test
        working-directory: build-asan
        run: ctest --test-dir . --output-on-failure --output-junit ctest-results-asan.xml

      - name: Upload sanitizer test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-results-asan
          path: build-asan/ctest-results-asan.xml
          if-no-files-found: ignore
