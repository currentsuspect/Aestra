name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  VCPKG_REF: 52f5569a8e867859fac967c1e3f10ca0a8a3cc39 # vcpkg tag 2026.03.18

jobs:
  build-linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false

      # --- Lane selection (#620) ---------------------------------------------
      # This job's NAME is a required status check on develop, so it must always run
      # and always report a conclusion. A skipped workflow reports nothing at all, and
      # a required context that never reports hangs every PR on "Expected — Waiting
      # for status" forever. The job therefore runs unconditionally and decides
      # internally whether the expensive steps below are worth doing.
      #
      # The classifier may only skip when certain: unknown paths, oversized change
      # sets and anything targeting main fall back to running everything.
      # See scripts/ci/classify-changes.sh and scripts/ci/lane-runs.sh.
      - name: Classify change scope
        id: scope
        uses: ./.github/actions/classify-scope
        with:
          lane: linux-gcc
          github-token: ${{ github.token }}
      - name: Install Dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libgl1-mesa-dev libx11-dev libsodium-dev libsecret-1-dev libgtest-dev cmake

      - name: Configure
        if: steps.scope.outputs.run == 'true'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DAestra_CORE_MODE=ON -DAESTRA_CI=ON

      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Test
        if: steps.scope.outputs.run == 'true'
        working-directory: build
        run: ctest --test-dir . --output-on-failure --output-junit ctest-results-linux.xml

      - name: License verification tests
        if: steps.scope.outputs.run == 'true'
        run: ctest --test-dir build -R "SecLicenseGateSignature|SecLicenseProfileHardening|SecJsonParserHardening" --output-on-failure

      - name: Upload test report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ctest-results-linux
          path: build/ctest-results-linux.xml
          if-no-files-found: ignore

      - name: Discord Notification
        if: always() && env.DISCORD_WEBHOOK != '' && steps.scope.outputs.run == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          STATUS="${{ job.status }}"
          COLOR=3066993; [ "$STATUS" != "success" ] && COLOR=15158332
          cat > discord_payload.json <<EOF
          {
            "username": "Aestra CI",
            "embeds": [{
              "title": "CI — Linux: $STATUS",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "color": $COLOR,
              "footer": {"text": "sha ${{ github.sha }}"}
            }]
          }
          EOF
          curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" --data @discord_payload.json "$DISCORD_WEBHOOK"

  # Compiles the full desktop app (Source/ + AestraUI) — the one lane that
  # catches UI/app build breakage. Every other lane passes AESTRA_CI=ON, which
  # force-disables the UI, so without this job the app can silently stop
  # building (it did once for a week, #396). Compile-only by design: tests are
  # owned by the headless lanes. Do NOT add AESTRA_CI=ON here — it would turn
  # this lane back into a headless build.
  build-linux-app:
    name: Linux (UI/App compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false

      # --- Lane selection (#620) ---------------------------------------------
      # This job's NAME is a required status check on develop, so it must always run
      # and always report a conclusion. A skipped workflow reports nothing at all, and
      # a required context that never reports hangs every PR on "Expected — Waiting
      # for status" forever. The job therefore runs unconditionally and decides
      # internally whether the expensive steps below are worth doing.
      #
      # The classifier may only skip when certain: unknown paths, oversized change
      # sets and anything targeting main fall back to running everything.
      # See scripts/ci/classify-changes.sh and scripts/ci/lane-runs.sh.
      - name: Classify change scope
        id: scope
        uses: ./.github/actions/classify-scope
        with:
          lane: ui-app
          github-token: ${{ github.token }}
      - name: Install Dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libasound2-dev libgl1-mesa-dev libx11-dev libsodium-dev libsecret-1-dev libsdl2-dev libfreetype-dev

      - name: Configure (UI enabled)
        if: steps.scope.outputs.run == 'true'
        run: cmake -B build-app -S . -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DAestra_CORE_MODE=ON -DAESTRA_ENABLE_UI=ON -DAESTRA_ENABLE_TESTS=OFF

      - name: Build app target
        if: steps.scope.outputs.run == 'true'
        run: cmake --build build-app --config ${{env.BUILD_TYPE}} --target Aestra --parallel

  build-windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false

      # --- Lane selection (#620) ---------------------------------------------
      # This job's NAME is a required status check on develop, so it must always run
      # and always report a conclusion. A skipped workflow reports nothing at all, and
      # a required context that never reports hangs every PR on "Expected — Waiting
      # for status" forever. The job therefore runs unconditionally and decides
      # internally whether the expensive steps below are worth doing.
      #
      # The classifier may only skip when certain: unknown paths, oversized change
      # sets and anything targeting main fall back to running everything.
      # See scripts/ci/classify-changes.sh and scripts/ci/lane-runs.sh.
      - name: Classify change scope
        id: scope
        uses: ./.github/actions/classify-scope
        with:
          lane: windows-msvc
          github-token: ${{ github.token }}
      - name: Cache vcpkg artifacts
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\vcpkg\downloads
            ${{ runner.temp }}\vcpkg\buildtrees
            ${{ runner.temp }}\vcpkg\packages
            ${{ runner.temp }}\vcpkg\installed
            ${{ runner.temp }}\vcpkg\archives
          key: windows-vcpkg-${{ env.VCPKG_REF }}-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            windows-vcpkg-${{ env.VCPKG_REF }}-${{ runner.os }}-

      - name: Setup vcpkg and libsodium
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "$env:RUNNER_TEMP\vcpkg"
          $env:VCPKG_BINARY_SOURCES = "clear;files,$env:RUNNER_TEMP\vcpkg\archives,readwrite"
          if (!(Test-Path "$env:VCPKG_ROOT\.git")) {
            $artifactBackup = Join-Path $env:RUNNER_TEMP "vcpkg-artifacts"
            $artifactDirs = @("downloads", "buildtrees", "packages", "installed", "archives")
            if (Test-Path $artifactBackup) { Remove-Item -Recurse -Force $artifactBackup }
            New-Item -ItemType Directory -Path $artifactBackup | Out-Null
            if (Test-Path $env:VCPKG_ROOT) {
              foreach ($dir in $artifactDirs) {
                $source = Join-Path $env:VCPKG_ROOT $dir
                if (Test-Path $source) {
                  Move-Item -Path $source -Destination (Join-Path $artifactBackup $dir)
                }
              }
              Remove-Item -Recurse -Force $env:VCPKG_ROOT
            }
            git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
            foreach ($dir in $artifactDirs) {
              $saved = Join-Path $artifactBackup $dir
              if (Test-Path $saved) {
                Move-Item -Path $saved -Destination (Join-Path $env:VCPKG_ROOT $dir)
              }
            }
          }
          git -C $env:VCPKG_ROOT fetch --depth=1 origin $env:VCPKG_REF
          git -C $env:VCPKG_ROOT checkout --force $env:VCPKG_REF
          if (!(Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          }
          & "$env:VCPKG_ROOT\vcpkg.exe" install libsodium:x64-windows gtest:x64-windows

      - name: Configure
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "$env:RUNNER_TEMP\vcpkg"
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} `
            -DAestra_CORE_MODE=ON `
            -DAESTRA_CI=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Test
        if: steps.scope.outputs.run == 'true'
        working-directory: build
        shell: bash
        run: ctest --test-dir . -C ${{env.BUILD_TYPE}} --output-on-failure --output-junit ctest-results-windows.xml

      - name: License verification tests
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: ctest --test-dir build -C ${{env.BUILD_TYPE}} -R "SecLicenseGateSignature|SecLicenseProfileHardening|SecJsonParserHardening" --output-on-failure

      - name: Upload test report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ctest-results-windows
          path: build/ctest-results-windows.xml
          if-no-files-found: ignore

      - name: Discord Notification
        if: always() && env.DISCORD_WEBHOOK != '' && steps.scope.outputs.run == 'true'
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          STATUS="${{ job.status }}"
          COLOR=3066993; [ "$STATUS" != "success" ] && COLOR=15158332
          cat > discord_payload.json <<EOF
          {
            "username": "Aestra CI",
            "embeds": [{
              "title": "CI — Windows: $STATUS",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "color": $COLOR,
              "footer": {"text": "sha ${{ github.sha }}"}
            }]
          }
          EOF
          curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" --data @discord_payload.json "$DISCORD_WEBHOOK"

  build-macos:
    name: macOS (Clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false

      # --- Lane selection (#620) ---------------------------------------------
      # This job's NAME is a required status check on develop, so it must always run
      # and always report a conclusion. A skipped workflow reports nothing at all, and
      # a required context that never reports hangs every PR on "Expected — Waiting
      # for status" forever. The job therefore runs unconditionally and decides
      # internally whether the expensive steps below are worth doing.
      #
      # The classifier may only skip when certain: unknown paths, oversized change
      # sets and anything targeting main fall back to running everything.
      # See scripts/ci/classify-changes.sh and scripts/ci/lane-runs.sh.
      - name: Classify change scope
        id: scope
        uses: ./.github/actions/classify-scope
        with:
          lane: macos-clang
          github-token: ${{ github.token }}
      - name: Install Dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          brew update
          brew install cmake pkg-config libsodium googletest

      - name: Configure
        if: steps.scope.outputs.run == 'true'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DAestra_CORE_MODE=ON -DAESTRA_CI=ON -DCMAKE_PREFIX_PATH="/opt/homebrew;/usr/local"

      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Test
        if: steps.scope.outputs.run == 'true'
        working-directory: build
        run: ctest --test-dir . --output-on-failure --output-junit ctest-results-macos.xml

      - name: License verification tests
        if: steps.scope.outputs.run == 'true'
        run: ctest --test-dir build -R "SecLicenseGateSignature|SecLicenseProfileHardening|SecJsonParserHardening" --output-on-failure

      - name: Upload test report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ctest-results-macos
          path: build/ctest-results-macos.xml
          if-no-files-found: ignore

      - name: Discord Notification
        if: always() && env.DISCORD_WEBHOOK != '' && steps.scope.outputs.run == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          STATUS="${{ job.status }}"
          COLOR=3066993; [ "$STATUS" != "success" ] && COLOR=15158332
          cat > discord_payload.json <<EOF
          {
            "username": "Aestra CI",
            "embeds": [{
              "title": "CI — macOS: $STATUS",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "color": $COLOR,
              "footer": {"text": "sha ${{ github.sha }}"}
            }]
          }
          EOF
          curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" --data @discord_payload.json "$DISCORD_WEBHOOK"

  classifier-selftest:
    name: CI classifier self-test
    runs-on: ubuntu-latest
    # Least privilege, declared rather than inherited. This job shells out and
    # queries two historical pull requests, so it reads repo contents and PR
    # metadata and needs nothing else — least of all a token that could push.
    permissions:
      contents: read
      pull-requests: read
    # Two separate guarantees, and the second is the one that was missing.
    #
    #   SAFETY   uncertainty falls back to broad
    #   LIVENESS a change that IS narrow actually produces a narrow verdict
    #
    # Safety alone is satisfiable by a classifier that has silently died: answer
    # "broad" to everything and every correctness assertion still passes while the
    # feature does nothing. That is exactly what shipped in this PR's first draft —
    # the fetch asked for a GraphQL field name against a REST endpoint, returned
    # blank lines with exit 0, and degraded into always-broad behind a fully green
    # matrix. Nothing failed, because nothing could fail.
    #
    # So this job asserts both directions, at both levels: the script in isolation,
    # and the real fetch pipeline end to end against two MERGED pull requests whose
    # file lists can never change again.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false
          # Nothing here pushes, so do not leave a credential in .git/config
          # for the scripts this job runs to find.
          persist-credentials: false

      # Level 1: the classifier itself. 42 cases, both directions, including the
      # look-alike paths and the degenerate input that produced a fail-open.
      - name: Classifier unit tests
        run: bash scripts/ci/classify-changes.test.sh

      # The verdict is only half the decision; this is the other half. A wrong entry
      # here removes a check just as effectively as a wrong verdict does.
      - name: Lane policy unit tests
        run: bash scripts/ci/lane-runs.test.sh

      # Level 2: the wiring. The unit tests all passed while the pipeline was dead,
      # because the bug was in how the file list was fetched, not in how it was
      # judged. This runs the real command against known history.
      - name: Fetch pipeline liveness and safety
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail=0

          # verdict_for <pr-number>  — the exact pipeline the scope steps run.
          verdict_for() {
            local pr="$1"
            gh api --paginate "repos/${{ github.repository }}/pulls/${pr}/files" \
              --jq '.[].filename' > "/tmp/files-${pr}.txt"
            local expected
            expected=$(gh pr view "${pr}" --repo "${{ github.repository }}" \
              --json changedFiles --jq '.changedFiles')
            local got
            got=$(grep -c . "/tmp/files-${pr}.txt") || got=0
            echo "  PR #${pr}: fetched ${got}, reports ${expected}" >&2
            if [ "${got}" -eq 0 ] && [ "${expected}" -gt 0 ]; then
              echo "::error::changed-file fetch returned nothing for #${pr} — the pipeline is dead" >&2
              return 1
            fi
            bash scripts/ci/classify-changes.sh "/tmp/files-${pr}.txt" "${expected}"
          }

          # LIVENESS: #619 was documentation only. If this stops saying skip-cxx,
          # the classifier has degraded to running everything and the feature is
          # dead — the failure this job exists to make visible.
          v=$(verdict_for 619) || fail=1
          if [ "${v:-}" != "skip-cxx" ]; then
            echo "::error::LIVENESS: docs-only #619 classified '${v:-<none>}', expected skip-cxx"
            fail=1
          else
            echo "liveness ok: docs-only #619 -> skip-cxx"
          fi

          # SAFETY: #618 changed a workflow. It must never be skippable.
          v=$(verdict_for 618) || fail=1
          if [ "${v:-}" != "broad" ]; then
            echo "::error::SAFETY: workflow change #618 classified '${v:-<none>}', expected broad"
            fail=1
          else
            echo "safety ok: workflow-only #618 -> broad"
          fi

          # LIVENESS (phase 2): #596 changed one .cpp under Source/Components and
          # nothing else. No headless target compiles that file — AESTRA_CI=ON
          # force-disables the UI — so only the UI/App lane can observe it. If this
          # stops saying ui-app-only, the phase 2 rule has gone inert.
          v=$(verdict_for 596) || fail=1
          if [ "${v:-}" != "ui-app-only" ]; then
            echo "::error::LIVENESS: UI-only #596 classified '${v:-<none>}', expected ui-app-only"
            fail=1
          else
            echo "liveness ok: UI-only #596 -> ui-app-only"
          fi

          # SAFETY: #610 touched AestraAudio and a test. Never narrow.
          v=$(verdict_for 610) || fail=1
          if [ "${v:-}" != "broad" ]; then
            echo "::error::SAFETY: audio change #610 classified '${v:-<none>}', expected broad"
            fail=1
          else
            echo "safety ok: audio+test #610 -> broad"
          fi

          exit "${fail}"

  format-check:
    name: Formatting (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-14 100

      - name: Check Formatting
        run: |
          FILES=$(find AestraAudio AestraCore AestraPlat AestraUI Source Tests -name "*.cpp" -o -name "*.hpp" -o -name "*.h" | grep -v External/)
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs clang-format --dry-run --Werror 2>&1 | head -100
          fi
        continue-on-error: true

  static-analysis:
    name: Static Analysis (clang-tidy, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # --- Lane selection (#620) ---------------------------------------------
      # Advisory lanes are not required contexts, but they are 38.8 of the 85
      # runner-minutes a PR costs. They build with AESTRA_CI=ON, which force-disables
      # the UI, so a docs-only or UI-only change cannot produce a finding here.
      - name: Classify change scope
        id: scope
        uses: ./.github/actions/classify-scope
        with:
          lane: tidy
          github-token: ${{ github.token }}

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-14 clang-format-14 libsodium-dev libsecret-1-dev

      - name: Configure
        if: steps.scope.outputs.run == 'true'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DAestra_CORE_MODE=ON -DAESTRA_CI=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        if: steps.scope.outputs.run == 'true'
        run: |
          clang-tidy-14 --config-file=.clang-tidy \
            AestraCore/src/*.cpp \
            -- -IAestraCore/include -std=c++17 2>&1 | head -100 || true
        continue-on-error: true

  sanitizer-linux:
    name: Sanitizers (ASan/UBSan, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false

      # --- Lane selection (#620) ---------------------------------------------
      # Advisory lanes are not required contexts, but they are 38.8 of the 85
      # runner-minutes a PR costs. They build with AESTRA_CI=ON, which force-disables
      # the UI, so a docs-only or UI-only change cannot produce a finding here.
      - name: Classify change scope
        id: scope
        uses: ./.github/actions/classify-scope
        with:
          lane: asan
          github-token: ${{ github.token }}

      - name: Install Dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libgl1-mesa-dev libx11-dev libsodium-dev libsecret-1-dev libgtest-dev cmake

      - name: Configure
        if: steps.scope.outputs.run == 'true'
        run: >
          cmake -B build-asan -S .
          -DCMAKE_BUILD_TYPE=Debug
          -DAestra_CORE_MODE=ON
          -DAESTRA_CI=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: cmake --build build-asan --config Debug

      - name: Test
        if: steps.scope.outputs.run == 'true'
        working-directory: build-asan
        run: ctest --test-dir . --output-on-failure --output-junit ctest-results-asan.xml

      - name: Upload sanitizer test report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ctest-results-asan
          path: build-asan/ctest-results-asan.xml
          if-no-files-found: ignore

  tsan-linux:
    name: ThreadSanitizer (TSan, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:suppress_equal_stacks=1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false
          persist-credentials: false

      # --- Lane selection (#620) ---------------------------------------------
      # Advisory lanes are not required contexts, but they are 38.8 of the 85
      # runner-minutes a PR costs. They build with AESTRA_CI=ON, which force-disables
      # the UI, so a docs-only or UI-only change cannot produce a finding here.
      - name: Classify change scope
        id: scope
        uses: ./.github/actions/classify-scope
        with:
          lane: tsan
          github-token: ${{ github.token }}

      - name: Install Dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libgl1-mesa-dev libx11-dev libsodium-dev libsecret-1-dev cmake

      - name: Configure
        if: steps.scope.outputs.run == 'true'
        run: cmake --preset ci-tsan

      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: cmake --build --preset ci-tsan --parallel 2

      - name: Test
        if: steps.scope.outputs.run == 'true'
        working-directory: build/ci-tsan
        run: ctest --parallel 2 --output-on-failure --output-junit ctest-results-tsan.xml

      - name: Upload TSan test report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ctest-results-tsan
          path: build/ci-tsan/ctest-results-tsan.xml
          if-no-files-found: ignore

  lsan-linux:
    # LeakSanitizer CI is an advisory regression detector for
    # unbounded or accidental allocations. LSan is informational
    # only; failure is expected to be non-blocking.
    name: LeakSanitizer (LSan, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/.lsan-suppressions:print_suppressions=0:halt_on_error=1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false
          persist-credentials: false

      # --- Lane selection (#620) ---------------------------------------------
      # Advisory lanes are not required contexts, but they are 38.8 of the 85
      # runner-minutes a PR costs. They build with AESTRA_CI=ON, which force-disables
      # the UI, so a docs-only or UI-only change cannot produce a finding here.
      - name: Classify change scope
        id: scope
        uses: ./.github/actions/classify-scope
        with:
          lane: lsan
          github-token: ${{ github.token }}

      - name: Install Dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libgl1-mesa-dev libx11-dev libsodium-dev libsecret-1-dev cmake

      - name: Configure
        if: steps.scope.outputs.run == 'true'
        run: cmake --preset ci-lsan

      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: cmake --build --preset ci-lsan --parallel 2

      - name: Test
        if: steps.scope.outputs.run == 'true'
        working-directory: build/ci-lsan
        run: ctest --parallel 2 --output-on-failure --output-junit ctest-results-lsan.xml

      - name: Upload LSan test report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ctest-results-lsan
          path: build/ci-lsan/ctest-results-lsan.xml
          if-no-files-found: ignore
