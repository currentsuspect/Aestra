name: Early Access Build

# Builds the desktop app for early-access testers: a Windows zip and a Linux tarball, uploaded as
# workflow artifacts (not a public release). Runs on pushes to early-access/** branches, which are cut
# from a known commit, so the build is exactly that commit plus this file.

on:
  push:
    branches: ['early-access/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  VCPKG_REF: 52f5569a8e867859fac967c1e3f10ca0a8a3cc39 # vcpkg tag 2026.03.18, same as ci.yml

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false
          persist-credentials: false

      - name: Fetch the VST3 SDK (plugin hosting)
        shell: pwsh
        run: |
          git submodule update --init --depth 1 AestraAudio/External/vst3sdk
          git -C AestraAudio/External/vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk

      - name: Setup vcpkg, libsodium and FreeType
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "$env:RUNNER_TEMP\vcpkg"
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout --force $env:VCPKG_REF
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:VCPKG_ROOT\vcpkg.exe" install libsodium:x64-windows freetype:x64-windows

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Configure (UI enabled)
        shell: pwsh
        run: |
          cmake -B build -S . -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DAestra_CORE_MODE=ON `
            -DAESTRA_ENABLE_UI=ON `
            -DAESTRA_ENABLE_TESTS=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        # -k 0 keeps going after a failure, so one run lists every Windows compile error.
        run: cmake --build build --config Release --target Aestra AestraPluginHost --parallel -- -k 0

      - name: Package
        shell: pwsh
        run: |
          $out = "Aestra-v0.8.2-preview-windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build\bin\Aestra.exe $out\
          if (Test-Path build\bin\AestraPluginHost.exe) { Copy-Item build\bin\AestraPluginHost.exe $out\ }
          Get-ChildItem build\bin -Filter *.dll | Copy-Item -Destination $out\
          # App-local Visual C++ runtime (Microsoft permits this), so a fresh PC does not fail with "MSVCP140.dll was not found".
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          Get-ChildItem $crt.FullName -Filter *.dll | Copy-Item -Destination $out\
          Copy-Item -Recurse build\bin\AestraAssets $out\AestraAssets
          Copy-Item LICENSE $out\ -ErrorAction SilentlyContinue
          Copy-Item "installer\READ ME FIRST.txt" $out\
          Get-ChildItem -Recurse $out | Select-Object FullName, Length

      # Smoke test: start the packaged app on this fresh Windows machine and prove it reaches a running window.
      # The runner has no GPU, so a throwaway copy gets Mesa's software OpenGL (llvmpipe, GL 4.5) next to the
      # exe; the zip testers download is untouched. Fails if Aestra exits, or never logs a core GL context.
      - name: Smoke test (start the app, screenshot)
        shell: pwsh
        run: |
          $ver = "26.2.4"
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/$ver/mesa3d-$ver-release-msvc.7z" -OutFile mesa.7z
          7z x mesa.7z -omesa -y | Out-Null
          $test = "smoke"
          Copy-Item -Recurse "Aestra-v0.8.2-preview-windows-x64" $test
          Copy-Item mesa\x64\*.dll $test\
          $env:GALLIUM_DRIVER = "llvmpipe"
          $env:APPDATA = "$PWD\smoke-appdata"; New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $p = Start-Process -FilePath "$test\Aestra.exe" -WorkingDirectory $test -PassThru
          Start-Sleep -Seconds 40
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force smoke-out | Out-Null
          $bmp.Save("smoke-out\screen.png")
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force } else { "Aestra exited with code $($p.ExitCode)" }
          Copy-Item "$test\aestra_debug.log" smoke-out\ -ErrorAction SilentlyContinue
          Get-Content smoke-out\aestra_debug.log -ErrorAction SilentlyContinue | Select-Object -Last 40
          $log = Get-Content smoke-out\aestra_debug.log -Raw -ErrorAction SilentlyContinue
          if (-not $alive) { Write-Error "Aestra did not stay running"; exit 1 }
          if ($log -notmatch "OpenGL core context created") { Write-Error "No core OpenGL context in the log"; exit 1 }
          "Smoke test passed: Aestra is running with a core GL context."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-test
          path: smoke-out
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Aestra-v0.8.2-preview-windows-x64
          path: Aestra-v0.8.2-preview-windows-x64
          retention-days: 30

  linux:
    name: Linux app
    # 22.04 (glibc 2.35) so the binary also runs on older distros, not only current ones.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false
          persist-credentials: false

      - name: Fetch the VST3 SDK (plugin hosting)
        shell: bash
        run: |
          git submodule update --init --depth 1 AestraAudio/External/vst3sdk
          git -C AestraAudio/External/vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libasound2-dev libgl1-mesa-dev libx11-dev libsodium-dev libsecret-1-dev libsdl2-dev libfreetype-dev

      - name: Configure (UI enabled)
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DAestra_CORE_MODE=ON -DAESTRA_ENABLE_UI=ON -DAESTRA_ENABLE_TESTS=OFF

      - name: Build
        run: cmake --build build --target Aestra AestraPluginHost --parallel

      - name: Package
        run: |
          out=Aestra-v0.8.2-preview-linux-x64
          mkdir -p "$out"
          cp build/bin/Aestra "$out/"
          [ -f build/bin/AestraPluginHost ] && cp build/bin/AestraPluginHost "$out/"
          cp -r build/bin/AestraAssets "$out/"
          cp LICENSE "$out/" 2>/dev/null || true
          cp "installer/READ ME FIRST.txt" "$out/"
          strip "$out/Aestra" "$out/AestraPluginHost" 2>/dev/null || true
          # libsodium's soname differs between distros (.so.23 here, .so.26 on Arch/newer), so ship ours
          # next to the binary and point the RPATH at it. The other libs keep stable sonames everywhere.
          sudo apt-get install -y patchelf
          mkdir -p "$out/lib"
          cp -L "$(ldd build/bin/Aestra | awk '/libsodium/ {print $3}')" "$out/lib/"
          patchelf --set-rpath '$ORIGIN/lib' "$out/Aestra"
          ldd "$out/Aestra" | grep -v -E 'linux-vdso|ld-linux' | awk '{print $1}'
          tar czf "$out.tar.gz" "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: Aestra-v0.8.2-preview-linux-x64
          path: Aestra-v0.8.2-preview-linux-x64.tar.gz
          retention-days: 30

  publish:
    name: Publish to the early channel
    needs: [windows, linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      AESTRA_UPDATE_PUBLIC_KEY: 8607d73af647b6d289c56d567fe40787ebfde329aeaaf8e96fe1f1e9e6f616d4
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish (update.aestra.studio, early channel)
        env:
          AESTRA_UPDATE_SIGNING_KEY: ${{ secrets.AESTRA_UPDATE_SIGNING_KEY }}
          AESTRA_UPDATE_UPLOAD_KEY: ${{ secrets.AESTRA_UPDATE_UPLOAD_KEY }}
        run: |
          pip install --quiet cryptography
          # early-access/v0.8.2 -> 0.8.2-preview.<run number>: each push is newer than the last
          base=${GITHUB_REF_NAME#early-access/v}
          version="${base}-preview.${GITHUB_RUN_NUMBER}"
          printf 'Early-access build %s (%s)\n' "$version" "$(git log -1 --format=%s)" > notes.txt
          (cd artifacts/Aestra-*-windows-x64 && zip -qr "$GITHUB_WORKSPACE/Aestra-$version-windows-x64.zip" .)
          cp artifacts/Aestra-*-linux-x64/*.tar.gz "Aestra-$version-linux-x64.tar.gz"
          tools/update/publish.sh early windows-x64 "$version" "Aestra-$version-windows-x64.zip" notes.txt
          tools/update/publish.sh early linux-x64 "$version" "Aestra-$version-linux-x64.tar.gz" notes.txt
